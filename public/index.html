<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlashDesk</title>
  <link rel="stylesheet" href="styles.css">
  <!-- build:pwa -->
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="wordmark">
        <h1>Flash<span class="accent">Desk</span></h1>
        <div class="micro-label">间隔复习</div>
      </div>
      <nav class="nav">
        <button class="btn tab" data-view="review">复习</button>
        <button class="btn tab" data-view="quiz">测验</button>
        <button class="btn tab" data-view="add">新增</button>
        <button class="btn tab" data-view="browse">词库</button>
        <label class="deck-filter">
          <span class="micro-label">分类</span>
          <select id="deck-filter"></select>
        </label>
      </nav>
    </header>

    <section id="view-review" hidden>
      <div class="review-top">
        <div class="micro-label" id="due-count"></div>
        <div class="dir-switch" id="dir-switch" hidden>
          <button class="dir-opt" data-dir="keyword">关键词</button>
          <button class="dir-opt" data-dir="description">释义</button>
          <button class="dir-opt" data-dir="mixed">随机混合</button>
        </div>
      </div>
      <div id="review-area"></div>
    </section>

    <section id="view-quiz" hidden>
      <div id="quiz-area"></div>
    </section>

    <section id="view-add" hidden>
      <form id="add-form" class="panel form-panel">
        <label class="field">
          <span class="micro-label">内容类型</span>
          <select id="add-type">
            <option value="Words" selected>单词</option>
            <option value="Sentences">长句</option>
          </select>
        </label>
        <label class="field">
          <span class="micro-label" id="add-front-label">英文单词</span>
          <textarea id="add-front" rows="3" placeholder="例如：apple" required></textarea>
        </label>
        <label class="field">
          <span class="micro-label" id="add-back-label">中文意思 / 学习备注</span>
          <textarea id="add-back" rows="3" placeholder="例如：苹果；可填写用法备注" required></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="add-submit">添加单词</button>
          <span id="add-flash" class="micro-label flash" hidden>已添加 ✓</span>
        </div>
      </form>
    </section>

    <section id="view-browse" hidden>
      <div class="browse-toolbar">
        <div class="micro-label" id="browse-count"></div>
        <button class="btn" id="copy-stats-browse">复制学习统计</button>
      </div>
      <div class="panel table-panel">
        <div class="table-wrap">
          <table id="browse-table">
            <thead>
              <tr>
                <th>英文</th>
                <th>中文 / 备注</th>
                <th>分类</th>
                <th>下次复习</th>
                <th>连续记住</th>
                <th>遗忘次数</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <pre id="stats-fallback" class="stats-pre" hidden></pre>
      <div id="data-panel" class="panel data-panel" hidden>
        <div class="micro-label">备份与迁移</div>
        <p class="muted">导出会生成包含全部卡片和复习记录的 JSON。导入完整备份会替换全部数据；导入卡片列表则会合并新增卡片。</p>
        <textarea id="data-json" rows="6" spellcheck="false"></textarea>
        <div class="form-actions">
          <button class="btn" id="export-data">导出</button>
          <button class="btn" id="import-data">导入</button>
          <span class="micro-label" id="data-msg"></span>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="logic.js" defer></script>
  <script src="store.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
