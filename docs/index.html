<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlashDesk</title>
  <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#10142b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FlashDesk">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="wordmark">
        <h1>Flash<span class="accent">Desk</span></h1>
        <div class="micro-label">间隔复习</div>
      </div>
      <nav class="nav">
        <button class="btn tab" data-view="review">复习</button>
        <button class="btn tab" data-view="quiz">测验</button>
        <button class="btn tab" data-view="add">新增</button>
        <button class="btn tab" data-view="browse">词库</button>
        <label class="deck-filter">
          <span class="micro-label">分类</span>
          <select id="deck-filter"></select>
        </label>
      </nav>
    </header>

    <section id="view-review" hidden>
      <div class="review-top">
        <div class="micro-label" id="due-count"></div>
        <div class="dir-switch" id="dir-switch" hidden>
          <button class="dir-opt" data-dir="keyword">关键词</button>
          <button class="dir-opt" data-dir="description">释义</button>
          <button class="dir-opt" data-dir="mixed">随机混合</button>
        </div>
      </div>
      <div id="review-area"></div>
    </section>

    <section id="view-quiz" hidden>
      <div id="quiz-area"></div>
    </section>

    <section id="view-add" hidden>
      <form id="add-form" class="panel form-panel">
        <label class="field">
          <span class="micro-label">内容类型</span>
          <select id="add-type">
            <option value="Words" selected>单词</option>
            <option value="Sentences">长句</option>
          </select>
        </label>
        <label class="field">
          <span class="micro-label" id="add-front-label">英文单词</span>
          <textarea id="add-front" rows="3" placeholder="例如：apple" required></textarea>
        </label>
        <label class="field" data-word-field>
          <span class="micro-label">好记读法</span>
          <input id="add-memory-reading" placeholder="例如：ex（伊克斯）+ pect（佩克特）">
        </label>
        <label class="field" data-word-field>
          <span class="micro-label">简单中文读法</span>
          <input id="add-chinese-reading" placeholder="例如：伊克斯-佩克特">
        </label>
        <label class="field">
          <span class="micro-label" id="add-back-label">中文意思</span>
          <textarea id="add-back" rows="3" placeholder="例如：苹果；可填写用法备注" required></textarea>
        </label>
        <label class="field" data-word-field>
          <span class="micro-label">词形变化（可选）</span>
          <textarea id="add-forms" rows="2" placeholder="例如：expected, expecting（用逗号、中文逗号或换行分隔）"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="add-submit">添加单词</button>
          <span id="add-flash" class="micro-label flash" hidden>已添加 ✓</span>
        </div>
      </form>
    </section>

    <section id="view-browse" hidden>
      <div class="browse-toolbar">
        <div class="micro-label" id="browse-count"></div>
        <button class="btn" id="copy-stats-browse">复制学习统计</button>
      </div>
      <div class="panel table-panel">
        <div class="table-wrap">
          <table id="browse-table">
            <thead>
              <tr>
                <th>英文</th>
                <th>中文 / 备注</th>
                <th>分类</th>
                <th>下次复习</th>
                <th>连续记住</th>
                <th>遗忘次数</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
      <pre id="stats-fallback" class="stats-pre" hidden></pre>
      <div id="data-panel" class="panel data-panel" hidden>
        <div class="micro-label">备份与迁移</div>
        <p class="muted">导出会生成包含全部卡片和复习记录的 JSON。导入完整备份会替换全部数据；导入卡片列表则会合并新增卡片。</p>
        <textarea id="data-json" rows="6" spellcheck="false"></textarea>
        <div class="form-actions">
          <button class="btn" id="export-data">导出</button>
          <button class="btn" id="import-data">导入</button>
          <span class="micro-label" id="data-msg"></span>
        </div>
      </div>
    </section>
  </div>

  <dialog id="edit-dialog" aria-label="编辑卡片">
    <form id="edit-form" class="form-panel">
      <div data-edit-word hidden><span class="micro-label">编号</span> <span id="edit-number"></span></div>
      <label class="field">
        <span class="micro-label" id="edit-front-label">英文</span>
        <textarea id="edit-front" rows="4" required></textarea>
      </label>
      <label class="field" data-edit-word hidden>
        <span class="micro-label">好记读法</span>
        <input id="edit-memory-reading">
      </label>
      <label class="field" data-edit-word hidden>
        <span class="micro-label">简单中文读法</span>
        <input id="edit-chinese-reading">
      </label>
      <label class="field">
        <span class="micro-label" id="edit-back-label">中文 / 学习备注</span>
        <textarea id="edit-back" rows="4" required></textarea>
      </label>
      <label class="field" data-edit-word hidden>
        <span class="micro-label">词形变化（可选）</span>
        <textarea id="edit-forms" rows="2" placeholder="用逗号、中文逗号或换行分隔"></textarea>
      </label>
      <div class="form-actions">
        <button type="button" class="btn" id="edit-cancel">取消</button>
        <button type="submit" class="btn btn-primary" id="edit-save">保存</button>
      </div>
      <div id="edit-toast-slot" aria-live="polite"></div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="logic.js" defer></script>
  <script src="store.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
